name: Build Samedi 22h APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurer Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurer Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"
          validate-wrappers: false

      - name: Lancer les tests unitaires
        run: gradle testDebugUnitTest

      - name: Compiler l'APK Debug
        run: gradle assembleDebug

      - name: Publier l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: Samedi22-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
