name: Build Matchs JB-T5 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurer Android SDK 35
        run: |
          SDK_MANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
          "$SDK_MANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurer Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"
          validate-wrappers: false

      - name: Appliquer automatiquement les fichiers mis à jour
        run: |
          # 1. Si un sous-dossier de projet a été téléversé, fusionner ses fichiers
          if [ -d "Matchs_JB_T5_MyProj/app" ]; then
            cp -rf Matchs_JB_T5_MyProj/app/* app/
          fi
          if [ -d "Samedi22_MyProj/app" ]; then
            cp -rf Samedi22_MyProj/app/* app/
          fi

          # 2. Déplacer chaque fichier .kt vers son dossier selon son package
          for f in *.kt; do
            if [ -f "$f" ]; then
              PKG=$(grep -m 1 "^package " "$f" | sed 's/package //; s/;//; s/\r//')
              if [ -n "$PKG" ]; then
                DIR="app/src/main/java/$(echo "$PKG" | tr '.' '/')"
                mkdir -p "$DIR"
                echo "Déplacement de $f -> $DIR/$f"
                mv -f "$f" "$DIR/$f"
              fi
            fi
          done

          # 3. Déplacer strings.xml si présent à la racine
          if [ -f "strings.xml" ]; then
            echo "Déplacement de strings.xml -> app/src/main/res/values/strings.xml"
            mkdir -p app/src/main/res/values
            mv -f strings.xml app/src/main/res/values/strings.xml
          fi

      - name: Lancer les tests unitaires
        run: gradle testDebugUnitTest

      - name: Compiler l'APK Debug
        run: gradle assembleDebug

      - name: Publier l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: Matchs-JB-T5-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
